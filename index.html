<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>拾光 · Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f5f4f0;--panel:rgba(255,255,255,.76);--solid:#fff;--ink:#252622;--muted:#85877f;--line:rgba(45,48,39,.09);--accent:#71816c;--soft:#e9ede5;--shadow:0 12px 35px rgba(35,40,30,.08);--glass:rgba(255,255,255,.62)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;transition:.25s}
body.dark{--bg:#171916;--panel:rgba(39,42,37,.82);--solid:#252923;--ink:#f1f1eb;--muted:#a2a69b;--line:rgba(255,255,255,.09);--accent:#b3c2a8;--soft:#343b31;--shadow:0 12px 35px rgba(0,0,0,.25);--glass:rgba(40,44,38,.7)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 18px calc(112px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:24px 2px 18px}.brand small{color:var(--muted);letter-spacing:2px;font-size:10px}.brand h1{font-size:28px;margin:4px 0 0;letter-spacing:-1px}.round{width:42px;height:42px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(18px);font-size:18px}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:6px 0 20px;backdrop-filter:blur(18px)}.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px}.section-head h2{font-size:17px;margin:0}.sub{color:var(--muted);font-size:12px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}.chip{padding:8px 13px;border-radius:30px;background:var(--panel);border:1px solid var(--line);font-size:12px;white-space:nowrap;color:var(--muted)}.chip.active{background:var(--soft);color:var(--ink);border-color:transparent}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.note{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:16px;min-height:150px;box-shadow:var(--shadow);backdrop-filter:blur(20px);position:relative;overflow:hidden}.note h3{font-size:15px;margin:0 22px 9px;line-height:1.4}.note p{font-size:13px;color:var(--muted);line-height:1.65;margin:0 0 15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.note .meta{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}.pin{position:absolute;right:13px;top:13px;color:var(--accent)}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:38px 12px;background:var(--panel);border-radius:18px;font-size:13px}.fab{position:fixed;right:max(22px,calc((100vw - 720px)/2));bottom:calc(98px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:21px;background:var(--ink);color:var(--bg);font-size:28px;box-shadow:0 10px 28px #0002;z-index:5}
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(92%,520px);height:66px;border:1px solid var(--line);border-radius:24px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);box-shadow:0 12px 40px #0002;display:flex;justify-content:space-around;align-items:center;z-index:10}.tab{background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:58px}.tab span:first-child{font-size:19px}.tab.active{color:var(--accent);font-weight:700}
.overlay{position:fixed;inset:0;background:#0006;z-index:20;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(100%,760px);max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -12px 50px #0002}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheet h2{font-size:20px;margin:0}.close{background:var(--panel);border-radius:50%;width:34px;height:34px}.field{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin:7px 0 12px;outline:none}.field:focus{border-color:var(--accent)}textarea.field{min-height:210px;resize:vertical;line-height:1.7}.row{display:flex;gap:9px}.row>*{flex:1}.primary{background:var(--ink);color:var(--bg);padding:14px;border-radius:14px;width:100%;font-weight:650;margin-top:8px}.secondary{background:var(--soft);padding:12px;border-radius:13px}.label{font-size:11px;color:var(--muted);margin:6px 2px}.settings-card{padding:17px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin:10px 0}.settings-card h3{font-size:14px;margin:0 0 12px}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.setting-row:last-child{border:0}.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}.seg button{background:none;border-radius:9px;padding:7px 9px;font-size:11px}.seg button.selected{background:var(--solid);box-shadow:0 2px 8px #0001}.hidden{display:none!important}
@media(min-width:620px){.app{padding-top:30px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.overlay{align-items:center}.sheet{border-radius:26px;max-height:85vh}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><small>KEEP YOUR MOMENTS</small><h1 id="greeting">拾光</h1></div><button class="round" id="quickSearch" aria-label="搜索">⌕</button></header>
<div class="search"><span>⌕</span><input id="search" placeholder="搜索便签、日记和关键词…"></div>
<div id="homeView">
<div class="section-head"><h2 id="viewTitle">最近记录</h2><span class="sub" id="count">0 条记录</span></div>
<div class="chips" id="filters"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="pinned">置顶</button><button class="chip" data-filter="favorite">收藏</button><button class="chip" data-filter="note">便签</button><button class="chip" data-filter="diary">日记</button></div>
<div class="cards" id="cards"></div>
</div>
<div id="settingsView" class="hidden">
<div class="section-head"><h2>我的空间</h2><span class="sub">让记录井然有序</span></div>
<div class="settings-card"><h3>外观设置</h3><div class="setting-row"><span>主题模式</span><div class="seg" id="themeSeg"><button data-theme="light">浅色</button><button data-theme="dark">深色</button><button data-theme="auto">自动</button></div></div></div>
<div class="settings-card"><h3>数据管理</h3><div class="setting-row"><span>导出所有记录</span><button class="secondary" id="exportBtn">导出 JSON</button></div><div class="setting-row"><span>从备份恢复</span><button class="secondary" id="importBtn">选择文件</button><input type="file" id="importFile" accept="application/json" class="hidden"></div></div>
<div class="settings-card"><h3>关于拾光</h3><div class="setting-row"><span>版本</span><span class="sub">1.0.0</span></div><div class="setting-row"><span>数据存储</span><span class="sub">仅保存在当前设备</span></div></div>
</div>
</div>
<button class="fab" id="addBtn" aria-label="新建">＋</button>
<nav><button class="tab active" data-tab="home"><span>⌂</span>首页</button><button class="tab" data-tab="notes"><span>▤</span>便签</button><button class="tab" data-tab="diary"><span>▧</span>日记</button><button class="tab" data-tab="settings"><span>◉</span>我的</button></nav>
<div class="overlay" id="editor"><div class="sheet"><div class="sheet-top"><h2 id="editorTitle">新建记录</h2><button class="close" id="closeEditor">×</button></div>
<div class="row"><button class="secondary" id="typeNote">便签</button><button class="secondary" id="typeDiary">日记</button></div>
<div class="label">标题</div><input class="field" id="titleInput" placeholder="给这段记录一个标题…">
<div class="label">正文</div><textarea class="field" id="bodyInput" placeholder="写下此刻的想法…"></textarea>
<div class="row"><div><div class="label">分类</div><select class="field" id="category"><option>随手记</option><option>工作</option><option>生活</option><option>灵感</option><option>学习</option><option>旅行</option></select></div><div><div class="label">心情</div><select class="field" id="mood"><option value="">不设置</option><option>😊 开心</option><option>🌿 平静</option><option>✨ 期待</option><option>😔 低落</option><option>🔥 充满干劲</option></select></div></div>
<div class="row"><button class="secondary" id="pinBtn">☆ 置顶</button><button class="secondary" id="favBtn">♡ 收藏</button></div><button class="primary" id="saveBtn">保存记录</button><button class="secondary hidden" id="deleteBtn" style="width:100%;margin-top:9px;color:#c66">删除这条记录</button>
</div></div>
<script>
const $=id=>document.getElementById(id);let items=JSON.parse(localStorage.getItem('shiguang_items')||'[]'),filter='all',tab='home',editing=null,kind='note',pinned=false,favorite=false,theme=localStorage.getItem('shiguang_theme')||'auto';
const today=()=>new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
function applyTheme(){let dark=theme==='dark'||(theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',dark);document.querySelector('meta[name=theme-color]').content=dark?'#171916':'#f5f4f0';document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('selected',b.dataset.theme===theme))}
function persist(){localStorage.setItem('shiguang_items',JSON.stringify(items));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=$('search').value.trim().toLowerCase();let arr=items.filter(x=>(filter==='all'||(filter==='pinned'&&x.pinned)||(filter==='favorite'&&x.favorite)||(filter==='note'&&x.kind==='note')||(filter==='diary'&&x.kind==='diary'))&&(!q||(x.title+x.body+x.category).toLowerCase().includes(q))&&(tab!=='notes'||x.kind==='note')&&(tab!=='diary'||x.kind==='diary'));arr.sort((a,b)=>(b.pinned-a.pinned)||b.updated-a.updated);$('count').textContent=arr.length+' 条记录';$('viewTitle').textContent=tab==='notes'?'我的便签':tab==='diary'?'日记时光':'最近记录';$('cards').innerHTML=arr.length?arr.map(x=>`<article class="note" data-id="${x.id}"><span class="pin">${x.pinned?'◆':''}</span><h3>${esc(x.title||'无标题')}</h3><p>${esc(x.body||'还没有写下内容')}</p><div class="meta"><span>${x.kind==='diary'?'日记':'便签'} · ${esc(x.category||'随手记')}</span><span>${new Date(x.updated).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})}</span></div></article>`).join(''):'<div class="empty">还没有记录<br><br>点下方 ＋，写下第一段文字吧</div>'}
function openEditor(item=null,k='note'){editing=item?.id||null;kind=item?.kind||k;pinned=!!item?.pinned;favorite=!!item?.favorite;$('editorTitle').textContent=item?'编辑记录':'新建记录';$('titleInput').value=item?.title||'';$('bodyInput').value=item?.body||'';$('category').value=item?.category||'随手记';$('mood').value=item?.mood||'';$('typeNote').classList.toggle('selected',kind==='note');$('typeDiary').classList.toggle('selected',kind==='diary');$('pinBtn').textContent=pinned?'◆ 已置顶':'☆ 置顶';$('favBtn').textContent=favorite?'♥ 已收藏':'♡ 收藏';$('deleteBtn').classList.toggle('hidden',!item);$('editor').classList.add('show')}
function closeEditor(){$('editor').classList.remove('show')}
$('addBtn').onclick=()=>openEditor(null,tab==='diary'?'diary':'note');$('closeEditor').onclick=closeEditor;
$('typeNote').onclick=()=>{kind='note';$('typeNote').classList.add('selected');$('typeDiary').classList.remove('selected')};$('typeDiary').onclick=()=>{kind='diary';$('typeDiary').classList.add('selected');$('typeNote').classList.remove('selected')};
$('pinBtn').onclick=()=>{pinned=!pinned;$('pinBtn').textContent=pinned?'◆ 已置顶':'☆ 置顶'};$('favBtn').onclick=()=>{favorite=!favorite;$('favBtn').textContent=favorite?'♥ 已收藏':'♡ 收藏'};
$('saveBtn').onclick=()=>{let title=$('titleInput').value.trim(),body=$('bodyInput').value.trim();if(!title&&!body){$('titleInput').focus();return}let old=items.find(x=>x.id===editing);let obj={id:editing||Date.now().toString(),kind,title,body,category:$('category').value,mood:$('mood').value,pinned,favorite,created:old?.created||Date.now(),updated:Date.now()};if(old)items=items.map(x=>x.id===editing?obj:x);else items.unshift(obj);persist();closeEditor()};
$('deleteBtn').onclick=()=>{if(confirm('确定删除这条记录吗？')){items=items.filter(x=>x.id!==editing);persist();closeEditor()}};
$('cards').onclick=e=>{let card=e.target.closest('.note');if(card)openEditor(items.find(x=>x.id===card.dataset.id))};
$('filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()};
$('search').oninput=render;$('quickSearch').onclick=()=>$('search').focus();
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('homeView').classList.toggle('hidden',tab==='settings');$('settingsView').classList.toggle('hidden',tab!=='settings');$('addBtn').classList.toggle('hidden',tab==='settings');if(tab==='home')filter='all';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));render()});
$('themeSeg').onclick=e=>{let b=e.target.closest('[data-theme]');if(!b)return;theme=b.dataset.theme;localStorage.setItem('shiguang_theme',theme);applyTheme()};
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({app:'拾光',version:1,items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='拾光备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text()),incoming=Array.isArray(data)?data:data.items;if(!Array.isArray(incoming))throw Error();if(confirm('导入会合并记录，是否继续？')){let ids=new Set(items.map(x=>x.id));items=[...items,...incoming.filter(x=>!ids.has(x.id))];persist();alert('恢复完成')}}catch{alert('文件格式不正确')}e.target.value=''};
applyTheme();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
